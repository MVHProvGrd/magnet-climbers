name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck:worker
      - run: npm run build
        env:
          # Repo → Settings → Secrets and variables → Actions → Variables → LEADERBOARD_URL
          # the public Worker URL; the variable overrides it (set it to "off" to build without a board)
          VITE_LEADERBOARD_URL: ${{ vars.LEADERBOARD_URL || 'https://magnet-climbers-api.magnetclimbers.workers.dev' }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-worker:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # typecheck:worker already ran in the build job this depends on. The `secrets` context
      # can't be read in an `if:` (that's what broke this workflow's scheduling entirely last
      # time this was tried), so the skip-when-unset check happens in the shell instead.
      - name: Deploy Worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set (Settings -> Secrets and variables -> Actions) -- skipping Worker deploy"
            exit 0
          fi
          npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
