name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck:worker
      - run: npm run build
        env:
          # Repo → Settings → Secrets and variables → Actions → Variables → LEADERBOARD_URL
          # the public Worker URL; the variable overrides it (set it to "off" to build without a board)
          VITE_LEADERBOARD_URL: ${{ vars.LEADERBOARD_URL || 'https://magnet-climbers-api.magnetclimbers.workers.dev' }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-worker:
    needs: build
    runs-on: ubuntu-latest
    # Skips cleanly, not a red X, until the secret exists: Repo → Settings → Secrets and
    # variables → Actions → Secrets → CLOUDFLARE_API_TOKEN (a token scoped to Workers Scripts
    # edit + D1 edit on this account is enough; wrangler.toml already names the account's
    # resources). Until then the Worker stays a manual `npx wrangler deploy` from worker/.
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: deploy
