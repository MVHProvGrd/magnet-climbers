name = "magnet-climbers-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# Challenge share links (Open Graph cards) live on share.magnetclimbers.com.
# The zone is on Cloudflare, so deploy creates the DNS record itself.
routes = [{ pattern = "share.magnetclimbers.com", custom_domain = true }]

# Bundled font and base image for the score card renderer.
rules = [{ type = "Data", globs = ["**/*.ttf", "**/*.jpg"], fallthrough = true }]

# Create the database once:  npx wrangler d1 create magnet-climbers
# then paste the database_id it prints below and run:
#   npx wrangler d1 execute magnet-climbers --remote --file=schema.sql
#   npx wrangler deploy
[[d1_databases]]
binding = "DB"
database_name = "magnet-climbers"
database_id = "27e2ffee-ec73-4b7a-80a0-b68633ffb132"

[vars]
# Daily score replay. "shadow" verifies the tape and records the verdict but keeps every
# row; "enforce" refuses a row the replay does not confirm. Flip once the shadow log is clean.
TAPE_MODE = "shadow"
ALLOWED_ORIGINS = "https://magnetclimbers.com,https://www.magnetclimbers.com,https://mvhprovgrd.github.io,http://localhost:5180"
# Accounts: the Firebase project whose Google/Apple sign-ins /auth accepts. Leave empty and
# the route answers 503 and the game shows no sign-in. The client needs VITE_FIREBASE_CONFIG.
FIREBASE_PROJECT_ID = ""

# Live races: one Durable Object per match relaying inputs between two phones and settling
# the result by replaying both tapes. SQLite-backed classes run on the free plan.
[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]
